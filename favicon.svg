<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#8b5cf6" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#bgGrad)"/>
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Letter C -->
  <path d="M42 23.5 C38.5 19 33.5 16.5 28 17 C18.5 17.5 12 24.5 12.5 32 C13 39.5 20 46 29 46.5 C34 46.7 39 44.5 42 40.5"
        stroke="url(#cGrad)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- Small neon dot accent -->
  <circle cx="44.5" cy="23.5" r="3.5" fill="#22d3ee" opacity="0.9"/>
  <circle cx="44.5" cy="40.5" r="3.5" fill="#a78bfa" opacity="0.9"/>
</svg>
